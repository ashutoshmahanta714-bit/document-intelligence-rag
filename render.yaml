services:
  - type: web
    name: document-intelligence-rag
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_USERNAME
        value: docintel
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHROMA_PATH
        value: /tmp/chroma_db
      - key: UPLOAD_DIR
        value: /tmp/uploads
